<div class="bg">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
      <path fill="#055459" fill-opacity="1" d="M0,288L48,250.7C96,213,192,139,288,122.7C384,107,480,149,576,138.7C672,128,768,64,864,53.3C960,43,1056,85,1152,106.7C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>
  
  <div class="content">
    <p-toast position="bottom-center" key="bc"    
      [showTransformOptions]="'translateX(-100%)'" 
      [showTransitionOptions]="'500ms'" 
      [hideTransitionOptions]="'750ms'" 
      [showTransformOptions]="'translateY(100%)'"
    />
    <p-card >
  
      <ng-template pTemplate="header">
          <img alt="Event Image" [src]="user.image ? 'http://localhost:3000/uploads/' + user.image : 'http://localhost:3000/uploads/default.jpg'"/>
      </ng-template>
      
      <div class="eventName">
        <label for="name"><b>Név</b></label>
        <input 
            pInputText 
            id="name" 
            aria-describedby="eventName-help" 
            [(ngModel)]="updateUser.eventName"
            [value]="user.username" 
            [disabled]="true"
            />
      </div>
  
      <hr>
  
      <div class="eventName">
        <label for="name"><b>Email</b></label>
        <input 
            pInputText 
            id="name" 
            aria-describedby="eventName-help" 
            [(ngModel)]="updateUser.eventName"
            [value]="user.email"
            [disabled]="true"
            />
      </div>    
  
     <hr>
  
      <div class="eventName">
        <label for="name"><b>Kedvenc kategóriák</b></label>
        <input 
            pInputText 
            id="name" 
            aria-describedby="eventName-help" 
            [(ngModel)]="updateUser.eventName"
            [value]="user.category" 
            [disabled]="true"
            />
      </div>
  
     <hr>
  
      <div class="eventName">
        <label for="name"><b>Születési dátum</b></label>
        <input 
            pInputText 
            id="name" 
            aria-describedby="eventName-help" 
            [(ngModel)]="updateUser.eventName"
            [value]="user.birthDate" 
            [disabled]="true"
            />
      </div>
  
    <hr>
  
      <div class="select">
        <label for="name"><b>Szerepkör</b></label>
            <p-dropdown 
            [options]="roles" 
            optionLabel="name" 
            optionValue="code" 
            [(ngModel)]="updateUser.role" 
            placeholder="Válaszd ki a szerepkört...">
            </p-dropdown>
      </div>
  
    <hr>
  
      <div class="select">
        <label for="name"><b>Státusz</b></label>
            <p-dropdown 
                [options]="status" 
                optionLabel="name" 
                optionValue="code"
                [(ngModel)]="updateUser.status"
                placeholder="Válaszd ki a státuszt...">
            </p-dropdown>
      </div>
  
  
      <ng-template pTemplate="footer">
          <div class="actionButton">
            <p-button (onClick)="backToTable()" label="Vissza" class="w-full" styleClass="w-full" severity="contrast"/>
            <p-button (onClick)="syncData()" label="Módosítás" class="w-full" styleClass="w-full" />
          </div>
      </ng-template>
  </p-card>
  
  </div>
  
  <app-footer></app-footer>
