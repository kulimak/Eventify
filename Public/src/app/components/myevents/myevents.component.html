<div class="content">

    <p-card  [style]="{ width: '560px' }">
  
      <ng-template pTemplate="header">
          <img alt="Card" src="https://primefaces.org/cdn/primeng/images/card-ng.jpg" />
      </ng-template>
      
      <div class="eventName">
        <label for="name"><b>Név</b></label>
        
      </div>
  
      <hr>
  
     <div class="eventDesc">
      <label for="eventDesc"><b>Leírás</b></label>
        
     </div>
  
     <hr>
  
     <div class="eventCalendar">
      <label for="eventCalendar"><b>Dátum</b></label>
      
     </div>
  
     <hr>
  
     <div class="eventAddress">
      <label for="eventAddress"><b>Cím</b></label>
      
    </div>
  
    <hr>
  
    <label for="eventEndStart"><b>Esemeny kezdete és vége</b></label>
    <div class="eventEndStart">
  
      <label id="eventEndStart-help">
        Kezdés:
      </label>
  
      
  
      <label id="eventEndStart-help">
        Vég:
      </label>
  
        
  
      
    </div>
  
      <ng-template pTemplate="footer">
          <div class="actionButton">
              <p-button severity="warning" label="Módosítás" class="w-full" styleClass="w-full" />
              <p-button severity="danger" label="Törlés" class="w-full" styleClass="w-full" />
          </div>
      </ng-template>
  </p-card>
  
</div>

<div class="bg">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
    <path fill="#055459" fill-opacity="1" d="M0,256L48,234.7C96,213,192,171,288,165.3C384,160,480,192,576,197.3C672,203,768,181,864,149.3C960,117,1056,75,1152,53.3C1248,32,1344,32,1392,32L1440,32L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
  </svg>
</div>
