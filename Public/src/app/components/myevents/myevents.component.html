<p-toast position="bottom-center" key="bc"    
  [showTransformOptions]="'translateX(-100%)'" 
  [showTransitionOptions]="'500ms'" 
  [hideTransitionOptions]="'750ms'" 
  [showTransformOptions]="'translateY(100%)'"
/>
<p-confirmDialog />

<ng-container *ngIf="ownEvents.length > 0; else noEvents">
  <div class="content" *ngFor="let event of ownEvents">

    <p-card>
  
      <ng-template pTemplate="header">
          <img alt="Card" [src]="'http://localhost:3000/uploads/' + event.image" />
      </ng-template>
      
      <div class="eventName">
        <label for="name"><b>{{ event.eventName }}</b></label>
        
      </div>
  
      <hr>
  
     <div class="eventDesc">
      <label for="eventDesc"><b>{{event.description}}</b></label>
        
     </div>
  
     <hr>
  
     <div class="eventCalendar">
      <label for="eventCalendar"><b>{{event.eventDate}}</b></label>
      
     </div>
  
     <hr>
  
     <div class="eventAddress">
      <label for="eventAddress"><b>{{event.eventAddress}}</b></label>
      
    </div>
  
    <hr>
  
    <label for="eventEndStart"><b>Esemeny kezdete és vége</b></label>
    <div class="eventEndStart">
  
      <label id="eventEndStart-help">
        Kezdés: {{event.eventStart}}
      </label>
  
      <label id="eventEndStart-help">
        Vég: {{event.eventEnd}}
      </label>
  
    </div>
  
      <ng-template pTemplate="footer">
          <div class="actionButton">
              <p-button severity="warning" label="Módosítás" class="w-full" styleClass="w-full" />

              <p-button severity="danger" label="Törlés" class="w-full" styleClass="w-full" (onClick)="deleteEvent($event, event.Id)" />
          </div>
      </ng-template>
  </p-card>

  </div>
</ng-container>
<ng-template #noEvents>
  <h1 id="ertesites">Még nincs általad létrehozott esemény</h1>
</ng-template>
