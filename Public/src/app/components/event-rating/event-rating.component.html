<div class="bg">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
      <path fill="#055459" fill-opacity="1" d="M0,288L48,250.7C96,213,192,139,288,122.7C384,107,480,149,576,138.7C672,128,768,64,864,53.3C960,43,1056,85,1152,106.7C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>
  
  <div class="content">
    <p-toast position="bottom-center" key="bc"    
      [showTransformOptions]="'translateX(-100%)'" 
      [showTransitionOptions]="'500ms'" 
      [hideTransitionOptions]="'750ms'" 
      [showTransformOptions]="'translateY(100%)'"
    />
    <H1>{{event.eventName}}</H1>
    <p>{{event.description}}</p>
    <hr>
    <div class="ratingDiv">

      <div class="ratingStars">
        <label for="float-input">Értékeld az eseményt:</label>
        <p-rating [(ngModel)]="newRating.rating" [cancel]="false"/>
      </div>

        <label for="float-input">Írd le a véleményed:</label>
        <textarea
          rows="10"
          cols="30"
          pInputTextarea 
          [autoResize]="true"
          [(ngModel)]="newRating.opinion">
        </textarea>

        <div class="actions">
          <p-button (onClick)="backToProfile()" label="Vissza" severity="contrast" class="w-full" styleClass="w-full" id="backBtn"/>
          <p-button (onClick)="uploadrating()" label="Feltöltés" class="w-full" styleClass="w-full" />
        </div>

    </div>

  </div>
  
  <app-footer></app-footer>
