<div class="bg">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
    <path fill="#055459" fill-opacity="1" d="M0,288L48,250.7C96,213,192,139,288,122.7C384,107,480,149,576,138.7C672,128,768,64,864,53.3C960,43,1056,85,1152,106.7C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
  </svg>
</div>

<div class="content">
  <p-toast position="bottom-center" key="bc"    
    [showTransformOptions]="'translateX(-100%)'" 
    [showTransitionOptions]="'500ms'" 
    [hideTransitionOptions]="'750ms'" 
    [showTransformOptions]="'translateY(100%)'"
  />
  <p-card >

    <ng-template pTemplate="header">
        <img [src]="'http://localhost:3000/uploads/placeholder.jpg'" />
    </ng-template>
    
    <div class="eventName">
      <label for="name"><b>Név</b></label>
      <input 
          pInputText 
          id="name" 
          aria-describedby="eventName-help" 
          [(ngModel)]="newEvent.eventName" />
      <small id="eventName-help">
          Ez lesz a neve a létrehozott eseménynek.
      </small>
    </div>

    <hr>

   <div class="eventDesc">
    <label for="eventDesc"><b>Leírás</b></label>
      <textarea 
      rows="5"
      cols="30" 
      pInputTextarea 
      [autoResize]="true"
      [(ngModel)]="newEvent.description">
    </textarea>
    <small id="eventDesc-help">
      Ezzel a szöveggel tudod jellemezni az eseményt.
    </small>
   </div>

   <hr>

   <div class="eventCalendar">
    <label for="eventCalendar"><b>Dátum</b></label>
    <p-calendar 
    [(ngModel)]="eventDateMoment"
    [minDate]="today"
    variant="filled" />
    <small id="eventCalendar-help">
      Ekkor kerül megrendezésre az esemény.
    </small>
   </div>

   <hr>

   <div class="eventAddress">
    <label for="eventAddress"><b>Cím</b></label>
    <input 
        pInputText 
        id="eventAddress" 
        aria-describedby="eventAddress-help" 
        [(ngModel)]="newEvent.eventAddress" />
    <small id="eventAddress-help">
        Ezen a címen kerül megrendezésre az esemény (irányítószám, település neve, utca, házszám).
    </small>
  </div>

  <hr>

  <label for="eventEndStart"><b>Esemeny kezdete és vége</b></label>
  <div class="eventEndStart">

    <label id="eventEndStart-help">
      Kezdés:
    </label>

    <input 
        pInputText 
        id="eventStart" 
        aria-describedby="eventEndStart-help" 
        [(ngModel)]="newEvent.eventStart" 
        placeholder="08:00"/>

    <label id="eventEndStart-help">
      Vég:
    </label>

        <input 
        pInputText 
        id="eventEnd" 
        aria-describedby="eventEndStart-help" 
        [(ngModel)]="newEvent.eventEnd" 
        placeholder="10:00"/>

  </div>

  <hr>

  <div class="category">

    <label id="eventCat-help">
      Kategóriák:
    </label>

    <p-selectButton 
    [options]="categories" 
    [(ngModel)]="newEvent.catId" 
    [multiple]="false" 
    optionLabel="name" 
    optionValue="value" />

    <small id="eventCat-help">
      Válaszd ki, milyen kategóriába tartozik az esemény
  </small>

  </div>

  <div class="">
    <input type="file" class="form-control" id="image" placeholder="" accept="image/*" (change)="onFileSelected($event)">
    <label for="image">Kép</label>
  </div>

    <ng-template pTemplate="footer">
        <div class="actionButton">
            <p-button (onClick)="uploadEvent()" label="Létrehozás" class="w-full" styleClass="w-full" />
        </div>
    </ng-template>
</p-card>

</div>

<app-footer></app-footer>
